<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repair Tracks — Dealer Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   Repair Tracks — one working prototype.

   A single phone with a real navigation stack. Every screen in the dealer path
   is reachable from inside it, exactly as in the app:

     Repair Jobs  →  ＋ New job  →  Dealer Batch  →  the drop-off
                  →  a device    →  the move       →  handover receipt

   Colours, radii, type and copy are lifted from design.dart, jobs_screen.dart,
   add_dealer_batch_screen.dart, batch_detail_screen.dart, job_detail_screen.dart,
   job_status.dart and batch_receipt_data.dart. The phone is LIGHT ONLY because
   the app runs themeMode: ThemeMode.light — only the page around it is themed.
   ========================================================================= */

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}

:root{
  --stage:#07211F; --stage2:#0F302D; --stage-line:#1B4643;
  --stage-ink:#EAF3F1; --stage-ink2:#9DBAB6; --stage-ink3:#6E918D;
  --stage-accent:#C9F003; --go-ink:#0A2018;
  --scale:1;
}
@media (prefers-color-scheme: light){
  :root{ --stage:#ECF2F1; --stage2:#FFFFFF; --stage-line:#D2E0DE;
    --stage-ink:#07211F; --stage-ink2:#456A66; --stage-ink3:#6E918D;
    --stage-accent:#4C6B00; --go-ink:#FFFFFF; }
}
:root[data-theme="dark"]{ --stage:#07211F; --stage2:#0F302D; --stage-line:#1B4643;
  --stage-ink:#EAF3F1; --stage-ink2:#9DBAB6; --stage-ink3:#6E918D;
  --stage-accent:#C9F003; --go-ink:#0A2018; }
:root[data-theme="light"]{ --stage:#ECF2F1; --stage2:#FFFFFF; --stage-line:#D2E0DE;
  --stage-ink:#07211F; --stage-ink2:#456A66; --stage-ink3:#6E918D;
  --stage-accent:#4C6B00; --go-ink:#FFFFFF; }

body{
  background:
    radial-gradient(900px 600px at 78% -10%, rgba(62,130,128,.24), transparent 60%),
    radial-gradient(700px 460px at 4% 30%, rgba(201,240,3,.06), transparent 62%),
    var(--stage);
  color:var(--stage-ink);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}

.wrap{min-height:100vh; display:grid; place-items:center; padding:14px}

/* ── The device ─────────────────────────────────────────────────────────── */
.bezel{
  width:calc(390px * var(--scale) + 18px); padding:9px;
  border-radius:calc(46px * var(--scale) + 9px);
  background:linear-gradient(155deg,#1E4240,#0A2422);
  box-shadow:0 34px 70px -20px rgba(0,0,0,.62), 0 0 0 1px rgba(255,255,255,.08) inset;
}
:root[data-theme="light"] .bezel{background:linear-gradient(155deg,#C3D5D3,#9CB4B1)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .bezel{background:linear-gradient(155deg,#C3D5D3,#9CB4B1)}}
.viewport{
  width:calc(390px * var(--scale)); height:calc(844px * var(--scale));
  border-radius:calc(46px * var(--scale)); overflow:hidden; position:relative; background:#fff;
}
.ph{
  --brand:#005655; --brand-deep:#003D3C; --brand-soft:#3E8280; --brand-tint:#E6EEEE; --accent:#C9F003;
  --ink:#0B1220; --ink2:#55606E; --ink3:#8A94A3; --line:#E4E8EE; --line2:#EFF2F6;
  --surface:#FFFFFF; --surface2:#F8FAFC; --canvas:#F4F6F9; --sunken:#F1F4F8;
  --danger:#BE123C; --danger-tint:#FEF2F4; --warn:#C2410C; --warn-tint:#FFF7ED;
  --good:#047857; --good-tint:#ECFDF5;
  --l-bg:#F0F4F8; --l-ink:#0F172A; --l-body:#475569; --l-mute:#64748B; --l-label:#94A3B8;
  --l-hint:#CBD5E1; --l-border:#E2E8F0; --l-fill:#F8FAFC; --l-seg:#F1F5F9; --l-red:#EF4444;
  --l-amber:#F59E0B; --l-blue:#3B82F6; --l-violet:#8B5CF6; --l-emerald:#10B981; --l-divider:#F5F5F5;
  --sh-card:0 1px 2px rgba(11,18,32,.039), 0 2px 8px rgba(11,18,32,.051);
  --sh-dock:0 -6px 20px rgba(11,18,32,.078);
  width:390px; height:844px; transform:scale(var(--scale)); transform-origin:top left;
  position:relative; overflow:hidden; display:flex; flex-direction:column;
  background:var(--canvas); font-family:'Inter',system-ui,'Segoe UI',sans-serif;
}
#screen{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; overflow:hidden}

/* ── App chrome ─────────────────────────────────────────────────────────── */
.band{background:linear-gradient(135deg,#003D3C 0%,#005655 52%,#3E8280 100%); flex:0 0 auto; padding-top:14px}
.hrow{display:flex; align-items:center; padding:4px 9px 12px}
.htitle{flex:1; min-width:0; padding-left:4px}
.htitle b{display:block; font-size:20px; font-weight:700; letter-spacing:-.4px; color:#fff;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.htitle span{display:block; font-size:11.5px; font-weight:500; color:rgba(255,255,255,.72); margin-top:2px;
  font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.hact{width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;background:none;border:0;padding:0;cursor:pointer}
.hact i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.18)}
.hact svg{width:18px;height:18px;fill:#fff}
.hact.fill i{background:var(--accent); border-color:var(--accent)}
.hact.fill svg{fill:var(--brand-deep)}
.hact:focus-visible i{outline:2px solid var(--accent); outline-offset:2px}
.search{
  margin:0 9px 12px; height:40px; border-radius:12px; display:flex; align-items:center; gap:9px;
  padding:0 12px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.18);
}
.search svg{width:17px;height:17px;fill:rgba(255,255,255,.7);flex:0 0 17px}
.search input{flex:1; min-width:0; background:none; border:0; outline:none; font:inherit;
  font-size:13.5px; font-weight:500; color:#fff}
.search input::placeholder{color:rgba(255,255,255,.55)}

.chips{height:54px; flex:0 0 auto; background:var(--surface); border-bottom:1px solid var(--line);
  display:flex; align-items:center; overflow-x:auto; gap:8px; padding:0 14px}
.chips::-webkit-scrollbar{height:0}
.chip{
  height:36px; flex:0 0 auto; border-radius:999px; padding:0 14px; cursor:pointer; font:inherit;
  display:inline-flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--line);
  transition:background .18s, border-color .18s;
}
.chip svg{width:15px;height:15px}
.chip .lb{font-size:12.5px;font-weight:600;letter-spacing:-.1px;color:var(--ink2)}
.chip .ct{font-size:11.5px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}

.scroll{flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden}
.scroll::-webkit-scrollbar{width:0}
.list{padding:12px 14px 28px}

.dayhead{height:32px; display:flex; align-items:flex-end; gap:8px; padding:0 0 6px; margin-top:4px}
.dayhead .t{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.dayhead .r{flex:1; height:1px}
.dayhead .c{font-size:11.5px;font-weight:500;font-variant-numeric:tabular-nums}
.dayhead svg{width:12px;height:12px;fill:var(--danger)}

.tcard{
  width:100%; text-align:left; font:inherit; cursor:pointer; display:flex; gap:10px;
  align-items:flex-start; padding:10px 10px 9px; margin-bottom:8px; border-radius:16px;
  transition:transform .11s ease-out;
}
.tcard:active{transform:scale(.985)}
.tcard:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
.lead{width:36px;height:36px;flex:0 0 36px;border-radius:11px;display:grid;place-items:center}
.lead svg{width:18px;height:18px}
.tbody{flex:1; min-width:0}
.trow1{display:flex; align-items:center; gap:8px}
.tname{display:block; flex:1; min-width:0; font-size:14.5px;font-weight:700;letter-spacing:-.2px;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.twho{display:block; font-size:11.5px;font-weight:600;letter-spacing:-.1px;color:var(--ink2);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rule{display:block; height:1px;margin:8px 0 7px;background-image:linear-gradient(to right,currentColor 3px,transparent 3px);
  background-size:6px 1px; background-repeat:repeat-x}
.trow2{display:flex; align-items:center; gap:6px}
.ttrace{display:block; flex:1; min-width:0; font-size:11.5px;font-weight:500;color:var(--ink3);
  font-variant-numeric:tabular-nums; overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mpill{flex:0 0 auto; padding:3px 8px; border-radius:8px; font-size:11.5px;font-weight:700;
  letter-spacing:-.3px; font-variant-numeric:tabular-nums; white-space:nowrap}
.oflag{flex:0 0 auto; padding:2px 6px; border-radius:6px; background:var(--danger-tint); color:var(--danger);
  font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase; white-space:nowrap}
.pill{display:inline-block; padding:3px 7px; border-radius:999px; font-size:10.5px;font-weight:700;
  letter-spacing:-.05px; white-space:nowrap}
.bmeter{display:flex; height:5px; border-radius:3px; overflow:hidden; margin:8px 0 7px}

.card{background:var(--surface); border-radius:16px; border:1px solid var(--line); box-shadow:var(--sh-card)}
.seclabel{display:flex; align-items:center; gap:8px; padding:0 2px 7px;
  font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink3)}
.seclabel .grow{flex:1}
.seclabel .cnt{font-size:11.5px;font-weight:500;letter-spacing:0;color:var(--ink3);font-variant-numeric:tabular-nums}
.money{font-variant-numeric:tabular-nums;letter-spacing:-.3px;font-weight:700}
.empty{padding:36px 36px 60px; text-align:center}
.empty .tile{width:60px;height:60px;margin:0 auto;border-radius:18px;background:var(--sunken);display:grid;place-items:center}
.empty .tile svg{width:27px;height:27px;fill:var(--ink3)}
.empty b{display:block; font-size:16px;font-weight:700;letter-spacing:-.2px;color:var(--ink);margin-top:16px}
.empty p{margin:5px 0 0; font-size:13px;font-weight:500;line-height:1.45;color:var(--ink2)}

.dock{flex:0 0 auto; background:var(--surface); border-top:1px solid var(--line);
  box-shadow:var(--sh-dock); padding:12px 14px 16px}
.btn{width:100%; height:46px; border:0; border-radius:12px; cursor:pointer; background:var(--brand);
  color:#fff; font:inherit; font-size:14px;font-weight:700;letter-spacing:-.2px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 12px;
  transition:filter .14s, transform .1s}
.btn svg{width:17px;height:17px;fill:currentColor}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:scale(.985)}
.btn:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
.btn.sec{background:var(--surface); color:var(--ink); border:1px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:default}

/* intake screen */
.ib-head{display:flex; align-items:flex-start; padding:8px 20px 20px 8px}
.ib-back{background:none;border:0;padding:8px;cursor:pointer;display:grid;place-items:center}
.ib-back svg{width:20px;height:20px;fill:#fff}
.ib-ttl{flex:1; min-width:0; padding:6px 0 0 4px}
.ib-ttl b{display:block;font-size:20px;font-weight:800;letter-spacing:-.3px;color:#fff}
.ib-ttl span{display:block;font-size:12px;color:rgba(255,255,255,.6);margin-top:1px}
.chip-demo{align-self:center;display:inline-flex;align-items:center;gap:5px;padding:7px 10px;border-radius:12px;
  cursor:pointer;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);
  font:inherit;font-size:12px;font-weight:700;color:#fff;margin-right:8px}
.chip-demo svg{width:15px;height:15px;fill:#fff}
.chip-count{align-self:center;padding:7px 12px;border-radius:12px;background:rgba(201,240,3,.15);
  border:1px solid rgba(201,240,3,.30);font-size:12px;font-weight:800;color:var(--accent);white-space:nowrap}
.ib-card{background:#fff;border-radius:20px;box-shadow:0 4px 12px rgba(0,0,0,.05);margin-bottom:14px}
.ib-h{display:flex;align-items:center;padding:16px 16px 0}
.ib-badge{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:900;margin-right:10px}
.ib-h .ico{width:16px;height:16px;margin-right:6px;flex:0 0 16px}
.ib-h b{font-size:14px;font-weight:800;color:var(--l-ink);letter-spacing:-.1px}
.ib-h .grow{flex:1}
.ib-rule{height:1px;background:var(--l-divider);margin:10px 16px 2px}
.ib-b{padding:12px 16px 16px}
.lnk{background:none;border:0;padding:0;cursor:pointer;font:inherit;font-size:13px;font-weight:700;
  color:var(--brand);display:inline-flex;align-items:center;gap:6px;min-height:32px}
.lnk svg{width:18px;height:18px;fill:currentColor}
.lnk[disabled]{color:var(--l-hint);cursor:default}
.fld{width:100%;display:flex;align-items:center;gap:12px;background:var(--l-fill);border:1px solid var(--l-border);
  border-radius:12px;padding:11px 14px;cursor:pointer;text-align:left;font:inherit;color:var(--l-ink)}
.fld:focus-visible{outline:none;border-color:var(--brand)}
.fld .ico{width:17px;height:17px;flex:0 0 17px;fill:var(--brand)}
.fld .body{flex:1;min-width:0}
.fld .lab{display:block;font-size:12px;color:var(--l-label)}
.fld .lab.up{font-size:13px}
.fld .val{display:block;font-size:14px;color:var(--l-ink);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fld .hint{display:block;font-size:12.5px;color:var(--l-hint);margin-top:2px}
.fld .caret{width:20px;height:20px;flex:0 0 20px;fill:var(--l-label)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.tag{background:rgba(0,86,85,.10);color:var(--brand);border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:600}
.inp{width:100%;font:inherit;font-size:14px;color:var(--l-ink);background:#fff;border:1px solid var(--l-border);
  border-radius:10px;padding:12px;outline:none}
.inp::placeholder{color:var(--l-hint)}
.inp:focus{border-color:var(--brand)}
.two{display:flex;gap:8px} .two>*{flex:1;min-width:0}
.stack>*+*{margin-top:10px}
.grp-lab{font-size:12px;font-weight:700;color:var(--l-label);margin-bottom:8px}
.segs{display:flex;gap:8px}
.seg{flex:1;border-radius:12px;padding:11px 0;cursor:pointer;font:inherit;font-size:13px;font-weight:700;
  text-align:center;background:var(--l-seg);border:1px solid var(--l-border);color:var(--l-body);
  transition:background .18s,color .18s,box-shadow .18s,border-color .18s}
.dev{background:var(--l-fill);border:1px solid var(--l-border);border-radius:14px;padding:8px 10px 10px;margin-bottom:10px}
.dev.err{background:#FEF2F2;border-color:var(--l-red);border-width:1.5px}
.dev-bar{display:flex;align-items:center;margin-bottom:8px}
.dev-n{width:22px;height:22px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;
  font-size:11px;font-weight:800}
.dev.err .dev-n{background:var(--l-red)}
.dev-bar .grow{flex:1}
.iconbtn{background:none;border:0;padding:5px;cursor:pointer;display:grid;place-items:center;border-radius:8px}
.iconbtn svg{width:17px;height:17px}
.scanbtn{background:rgba(0,86,85,.10);border:0;border-radius:10px;padding:6px;cursor:pointer;display:grid;place-items:center}
.scanbtn svg{width:18px;height:18px;fill:var(--brand)}
.more-btn{background:none;border:0;padding:0;cursor:pointer;font:inherit;font-size:12px;font-weight:600;
  color:var(--l-mute);display:inline-flex;align-items:center;gap:6px;min-height:30px;margin-top:8px}
.more-btn svg{width:18px;height:18px;fill:currentColor}
.cta{width:100%;height:56px;border:0;border-radius:18px;cursor:pointer;font:inherit;font-size:16px;
  font-weight:800;letter-spacing:.2px;color:#fff;background:linear-gradient(135deg,#003D3C,#005655);
  box-shadow:0 6px 18px rgba(0,86,85,.45);display:inline-flex;align-items:center;justify-content:center;
  gap:10px;margin-top:28px}
.cta svg{width:20px;height:20px;fill:var(--accent)}
.cta:hover{filter:brightness(1.06)}

/* batch detail */
.rollup{padding:12px 13px}
.ru-top{display:flex;align-items:flex-end}
.ru-l{flex:1}
.ru-l .k,.ru-r .k{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--ink3)}
.ru-l .v{font-size:27px;font-weight:700;letter-spacing:-1px;color:var(--ink);margin-top:2px;
  font-variant-numeric:tabular-nums;line-height:1.05}
.ru-r{text-align:right}
.ru-r .v{font-size:17px;font-weight:700;letter-spacing:-.3px;color:var(--warn);margin-top:4px;font-variant-numeric:tabular-nums}
.meter{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:12px}
.legend{display:flex;flex-wrap:wrap;gap:7px 14px;margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2);line-height:1.4}
.legend i{width:7px;height:7px;border-radius:50%;display:block}
.drow{display:flex;align-items:flex-start;width:100%;text-align:left;padding:9px 8px 9px 11px;margin-bottom:8px;
  cursor:pointer;font:inherit;background:var(--surface);border-radius:16px;border:1px solid var(--line);
  box-shadow:var(--sh-card);overflow:hidden;position:relative;transition:transform .11s ease-out}
.drow:active{transform:scale(.985)}
.drow:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.drow.late::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--danger)}
.drow .idx{width:28px;height:28px;flex:0 0 28px;border-radius:8px;background:var(--sunken);display:grid;
  place-items:center;font-size:11.5px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;margin-right:10px}
.drow .mid{flex:1;min-width:0}
.drow .nm{display:block; font-size:14px;font-weight:700;letter-spacing:-.2px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .id{display:block; font-size:11.5px;font-weight:500;color:var(--ink3);margin-top:3px;font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .flt{display:block; font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .mn{display:flex;align-items:center;gap:8px;margin-top:5px}
.drow .mn .m{font-size:12px}
.drow .mn .due{font-size:11.5px;font-weight:500;font-variant-numeric:tabular-nums}
.drow .rt{display:flex;align-items:center;margin-left:8px}
.drow .rt svg{width:18px;height:18px;fill:var(--ink3)}

/* job detail */
.hero{padding:14px 14px 12px;margin-bottom:14px}
.hero .k{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--ink3)}
.hero .amt{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:3px}
.hero .fig{font-size:27px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.1}
.hero hr{border:0;border-top:1px solid var(--line2);margin:12px 0 11px}
.phases{display:flex;align-items:center}
.phases .node{display:flex;flex-direction:column;align-items:center;gap:5px;flex:0 0 auto}
.phases .dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.phases .node.on .dot{box-shadow:0 0 0 3.5px rgba(0,86,85,.18)}
.phases .lb{font-size:10.5px;font-weight:500;color:var(--ink3)}
.phases .node.on .lb{font-weight:700;color:var(--ink2)}
.phases .bar{flex:1;height:2px;background:var(--line);margin:0 6px;position:relative;top:-9px}
.panel{padding:4px 13px 8px;margin-bottom:14px}
.kv{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 2px;border-top:1px solid var(--line2)}
.kv:first-child{border-top:0}
.kv .k{font-size:13px;font-weight:500;color:var(--ink2);flex:1}
.kv .v{font-size:13px;font-weight:600;letter-spacing:-.1px;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.kv .v.strong{font-weight:800}
.notice{display:flex;gap:9px;padding:10px 12px;border-radius:12px;margin-bottom:14px;font-size:12px;line-height:1.45}

function nextStep(s){
  switch(s){
    case 'pending': return {q:'Ready to start on this one?',
      choices:[{to:'in_progress',label:'Start working on it',detail:'Takes the job in your name',icon:'build'}],
      more:[{to:'waiting_parts',label:'Waiting for a part',detail:"The part it needs isn't in stock",icon:'parts'},
            {to:'cancelled',label:'Customer withdrew the job',icon:'cancel'}]};
    case 'waiting_parts': return {q:'Has the part arrived?',
      choices:[{to:'in_progress',label:'Resume work',detail:'Back on the bench',icon:'build'}],
      more:[{to:'pending',label:'Put back in the queue',icon:'hour'},
            {to:'cancelled',label:'Customer withdrew the job',icon:'cancel'}]};
    case 'in_progress': return {q:'Is this phone repairable?',
      choices:[{to:'completed',label:'Yes',detail:'Repaired and ready',icon:'check',kind:'good'},
               {to:'unrepairable',label:'No',detail:"Can't be fixed",icon:'block',kind:'bad'}],
      more:[{to:'waiting_parts',label:'Waiting for a part',icon:'parts'},
            {to:'pending',label:'Put back in the queue',icon:'hour'},
            {to:'cancelled',label:'Customer withdrew the job',icon:'cancel'}]};
    case 'completed': return {q:'Repaired. Hand it back?',
      choices:[{to:'out_for_delivery',label:'Dispatch to customer',detail:'Out with a rider, or ready to collect',icon:'ship'}],
      more:[{to:'delivered',label:'Collected at the counter',detail:'Take payment now',icon:'hand'},

            {to:'waiting_parts',label:'Waiting for a part',icon:'parts'}]};

/* ═══ 2 · Formatting ══════════════════════════════════════════════════════ */
const INR = new Intl.NumberFormat('en-IN',{maximumFractionDigits:0});
const inr = n => '₹' + INR.format(Math.round(n||0));
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const shortDate = d => d ? `${d.getDate()} ${MON[d.getMonth()]}` : '';
const longDate  = d => d ? `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}` : '—';
const dOnly = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
function relativeTime(d){
  const m = Math.floor((Date.now()-d.getTime())/60000);
  if (m<1) return 'Just now';
  if (m<60) return m+'m ago';
  const h = Math.floor(m/60); if (h<24) return h+'h ago';
  const dd = Math.floor(h/24); if (dd===1) return 'Yesterday';
  return dd<7 ? dd+'d ago' : shortDate(d);
}
function dayLabel(d){
  const days = Math.round((dOnly(new Date()) - dOnly(d)) / 86400000);
  if (days===0) return 'Today';
  if (days===1) return 'Yesterday';
  return shortDate(d) + (d.getFullYear()!==new Date().getFullYear() ? ' '+d.getFullYear() : '');
}
const isOverdue = j => !isClosed(j.status) && j.expected && dOnly(j.expected) < dOnly(new Date());
const svg = (p,cls='',st='') => `<svg class="${cls}" style="${st}" viewBox="0 0 24 24"><path d="${p}"/></svg>`;
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* AppColor.tint — an OPAQUE blend over white, so a pill reads the same on any ground */
function tint(hex,a){
  const n = parseInt(hex.slice(1),16), r=n>>16, g=(n>>8)&255, b=n&255;
  const m = v => Math.round(a*v + (1-a)*255);
  return `rgb(${m(r)},${m(g)},${m(b)})`;
}
const rgba = (hex,a) => { const n=parseInt(hex.slice(1),16);
  return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; };
function luhn15(b){ let s=0; for(let i=0;i<14;i++){ let d=+b[13-i]; if(i%2===0){d*=2; if(d>9)d-=9;} s+=d; }
  return b + ((10-(s%10))%10); }
const groupImei = s => s.replace(/\D/g,'').replace(/(.{4})/g,'$1 ').trim();

/* ═══ 3 · Money ═══════════════════════════════════════════════════════════ */
const paidOn  = j => (j.advance||0)+(j.cash||0)+(j.gpay||0);
const isBilled = j => (j.final||0) > 0;
const dueOn   = j => j.status==='cancelled' ? 0 : Math.max((j.final||0)-paidOn(j),0);
function moneyLabel(j){
  if (j.status==='cancelled') return {t:'Nothing owed', c:'#8A94A3'};
  if (!isBilled(j))           return {t:'Not billed',   c:'#8A94A3'};
  const d = dueOn(j);
  if (d>0) return {t: inr(d) + (isClosed(j.status)?' unpaid':' due'), c:'#C2410C'};
  return {t: inr(j.final)+' Settled', c:'#047857'};
}
function collect(j,target,typed){
  const usingEstimate = !needsBill(target) && (j.final||0)<=0 && (j.approx||0)>0;
  const basis = usingEstimate ? j.approx : needsBill(target) ? (parseFloat(typed)||0) : (j.final||0);
  const now = Math.max(0, basis - paidOn(j));
  const note = now>0 ? (usingEstimate ? 'No final amount was set, so the agreed estimate stands.'
                                      : 'Recalculated as you type the amount.')
             : (basis<=0 ? 'Nothing to collect — the fee was waived.'
                         : 'Nothing left to collect — already paid in full.');
  return {basis, now, note};
}

function rollup(bid){
  const d = jobsOf(bid);
  const done = d.filter(j=>['completed','out_for_delivery','delivered','unrepairable','returned'].includes(j.status)).length;
  const unrep = d.filter(j=>['unrepairable','returned'].includes(j.status)).length;
  const canc = d.filter(j=>j.status==='cancelled').length;
  return {deviceCount:d.length, doneCount:done, unrepairableCount:unrep, cancelledCount:canc,
    repairedCount:Math.max(done-unrep,0), openCount:Math.max(d.length-done-canc,0),
    totalDue:d.reduce((s,j)=>s+dueOn(j),0)};
}
function summaryLine(r){
  const p=[`${r.deviceCount} device${r.deviceCount===1?'':'s'}`];
  if (r.repairedCount>0) p.push(`${r.repairedCount} done`);
  if (r.unrepairableCount>0) p.push(`${r.unrepairableCount} not repairable`);
  if (r.openCount>0) p.push(`${r.openCount} open`);
  if (r.cancelledCount>0) p.push(`${r.cancelledCount} cancelled`);
  return p.join(' · ');
}

function matchesPhase(j, phase){
  if (phase==='in_shop')  return ST[j.status].phase===0;
  if (phase==='ready')    return ST[j.status].phase===1;
  if (phase==='handover') return ST[j.status].phase===2;
  return true;
}
function chipCount(phase){
  /* A count is only rendered when the current fetch can answer it honestly. */
  if (phase==='__dealers__')    return filter===null||filter==='__dealers__' ? DB.batches.length : null;
  if (phase==='__dispatched__') return (filter===null||filter==='__dispatched__'||filter==='handover')
                                       ? DB.jobs.filter(j=>j.status==='delivered').length : null;
  if (phase==='__returned__')   return (filter===null||filter==='__returned__')
                                       ? DB.jobs.filter(j=>['unrepairable','returned'].includes(j.status)).length : null;
  if (filter===null) return phase===null ? DB.jobs.filter(j=>!j.batchId).length + DB.batches.length
                                         : DB.jobs.filter(j=>matchesPhase(j,phase)).length;
  if (filter==='__returned__') return null;
  return phase===filter ? DB.jobs.filter(j=>matchesPhase(j,phase)).length : null;
}
function listItems(){
  const q = query.trim().toLowerCase();
  const hit = j => !q || [j.brand,j.model,j.jobNumber,j.imei,j.customerName,j.customerPhone,j.issue]
    .some(v => String(v||'').toLowerCase().includes(q));
  // A batch matches on the dealer and its own number, but also on any device
  // inside it — searching an IMEI must surface the drop-off holding that phone.
  const bhit = b => !q || [b.number, b.dealer.name, b.dealer.shop, b.dealer.phone]
    .some(v => String(v||'').toLowerCase().includes(q)) || jobsOf(b.id).some(hit);
  if (filter==='__dealers__')
    return DB.batches.filter(bhit).map(b=>({kind:'batch', b, at:b.createdAt}));
  if (filter===null){
    return [...DB.jobs.filter(j=>!j.batchId).filter(hit).map(j=>({kind:'job', j, at:j.createdAt})),
            ...DB.batches.filter(bhit).map(b=>({kind:'batch', b, at:b.createdAt}))]
           .sort((x,y)=>y.at-x.at);
  }
  let js = DB.jobs.filter(hit);
  if (filter==='__dispatched__') js = js.filter(j=>j.status==='delivered');
  else if (filter==='__returned__') js = js.filter(j=>['unrepairable','returned'].includes(j.status));
  else js = js.filter(j=>matchesPhase(j,filter));
  return js.sort((x,y)=>y.createdAt-x.createdAt).map(j=>({kind:'job', j, at:j.createdAt}));
}

/* ── The batch as one moving thing ─────────────────────────────────────────
   The drop-off walks a four-beat line — start, quote, dispatch, return the
   unfixable — and the dock only ever offers the beat the batch is actually on.
   Each beat still writes PER DEVICE: money is not a batch-level fact, so the
   sheets below set an amount on every handset rather than one on the tray. */
function batchStep(bid){
  const d = jobsOf(bid);
  if (!d.length) return {key:'empty'};
  const pending  = d.filter(j => j.status==='pending');
  const bench    = d.filter(j => j.status==='in_progress' || j.status==='waiting_parts');
  const ready    = d.filter(j => j.status==='completed' || j.status==='out_for_delivery');
  const unfixed  = d.filter(j => j.status==='unrepairable');
  if (pending.length) return {key:'start',    items:pending};
  if (bench.length)   return {key:'estimate', items:bench};
  if (ready.length)   return {key:'dispatch', items:ready};
  if (unfixed.length) return {key:'return',   items:unfixed};
  return {key:'closed', items:[]};
}
const BATCH_STEP = {
  start:    {cap:'Every device is still waiting', label:'Start the batch',       icon:'build',
             note:n => `Puts ${n} device${n===1?'':'s'} on the bench in one move.`},
  estimate: {cap:'On the bench',                  label:'Set the estimate',      icon:'check',
             note:n => `Quote ${n} device${n===1?'':'s'} — one figure, or each on its own.`},
  dispatch: {cap:'Ready to go back',              label:'Dispatch to the dealer',icon:'hand',
             note:n => `Bills and closes ${n} device${n===1?'':'s'}.`},
  return:   {cap:'Could not be fixed',            label:'Return the unrepaired', icon:'ret',
             note:n => `Hands ${n} device${n===1?'':'s'} back, fee optional.`},
};
function batchDockHtml(bid){
  const step = batchStep(bid);

    return `<span class="cap-lab">This drop-off is closed</span>
      <button class="btn sec" data-act="receipt2">${svg(ICON.receipt)}Send the dealer a handover receipt</button>`;

function wireBatch(id){

/* ── The bulk sheets ───────────────────────────────────────────────────────
   Every one of these lists the devices and writes each amount to its own job.
   The batch is the gesture; the device is still where the money lands. */
function bulkSheet(bid, kind){
  const step = batchStep(bid);
  const items = step.items.map(j => ({j, amt: kind==='estimate' ? String(j.approx||'')
                                         : kind==='dispatch' ? String(j.approx||j.final||'')
                                         : '', skip:false}));
  const money = kind !== 'start';
  const CFG = {
    start:    {title:'Start the batch',       sub:'Moves every waiting device onto the bench',
               cta:n => `Start ${n} device${n===1?'':'s'}`},
    estimate: {title:'Set the estimate',      sub:'Quote each device, then mark them repaired',
               cta:n => `Quote ${n} device${n===1?'':'s'}`, col:'Estimate'},
    dispatch: {title:'Dispatch to the dealer',sub:'The estimate becomes the bill — change any of it',
               cta:n => `Dispatch ${n} device${n===1?'':'s'}`, col:'Final'},
    return:   {title:'Return the unrepaired', sub:'Charge an inspection fee, or waive it',
               cta:n => `Return ${n} device${n===1?'':'s'}`, col:'Fee'},
  }[kind];

  const rows = () => items.map((it,i) => {
    const nm = `${it.j.brand} ${it.j.model}`.trim() || 'Unknown device';
    return `<div class="brow${it.skip?' off':''}" data-i="${i}">
      <span class="bidx">${i+1}</span>
      <span class="bname"><b>${esc(nm)}</b><small>#${esc(it.j.jobNumber)} · ${ST[it.j.status].label}</small></span>
      ${money?`<input class="bamt" data-i="${i}" inputmode="decimal" placeholder="0" value="${esc(it.amt)}" ${it.skip?'disabled':''}>`:''}
      ${kind==='estimate'?`<button class="bx" data-skip="${i}" aria-pressed="${it.skip}"
        title="Can't be fixed">${svg(ICON.block)}</button>`:''}
    </div>`;}).join('');

  const total = () => items.filter(it=>!it.skip).reduce((s,it)=>s+(parseFloat(it.amt)||0),0);
  const live  = () => items.filter(it=>!it.skip).length;

  const draw = () => {
    const totalRow = (kind==='dispatch'||kind==='return')
      ? `<div class="btot"><span class="k">${kind==='return'?'FEES':'TO BILL'}</span>
         <span class="v" id="bTot">${inr(total())}</span></div>` : '';
    const applyAll = money ? `
      <label class="flab">${CFG.col} for every device (₹)</label>
      <div class="two"><input class="finput" id="bAll" inputmode="decimal" placeholder="0">
        <button class="btn sec" id="bApply" style="height:46px;flex:0 0 118px">Apply to all</button></div>
      <span class="fhelp">${kind==='estimate'
        ? 'An estimate is a conversation, not a bill — nothing is owed until a device is billed.'
        : kind==='return'
        ? 'Leave a device empty to waive its fee. A device that was never billed owes nothing.'
        : 'Each figure is prefilled from that device’s estimate. Change any that moved.'}</span>
      <div class="seclabel" style="margin:16px 0 2px"><span class="grow">Devices</span>
        <span class="cnt" id="bCnt">${live()}</span></div>` : `
      <div class="notice info">${svg(ICON.build)}<div>Every waiting device moves to <b style="display:inline">In Progress</b>
        together. No money changes hands on this step.</div></div>
      <div class="seclabel" style="margin:16px 0 2px"><span class="grow">Devices</span><span class="cnt">${items.length}</span></div>`;

    openSheet(`<div class="grab"></div>
      <div class="sheet-h"><div class="g"><b>${esc(CFG.title)}</b><span>${esc(CFG.sub)}</span></div></div>
      <div class="sheet-b">${applyAll}<div id="bRows">${rows()}</div>${totalRow}</div>
      <div class="sheet-f">
        ${kind==='dispatch' ? `<button class="btn" id="bGo">${esc(ctaText())}</button>
          <button class="btn sec" id="bLater" style="margin-top:8px">Dispatch — the dealer pays later</button>`
        : `<button class="btn" id="bGo">${esc(ctaText())}</button>`}
      </div>`);
    wire();
  };

  const refreshTotals = () => {
    const t = $('bTot'); if (t) t.textContent = inr(total());
    const c = $('bCnt'); if (c) c.textContent = live();
    const g = $('bGo');
    if (g) g.textContent = ctaText();
  };
  const ctaText = () => live() === 0 && kind === 'estimate'
    ? 'Mark all as not repairable'
    : kind === 'dispatch' ? `${CFG.cta(live())} · collect ${inr(total())}` : CFG.cta(live());

  function wire(){
    const sh = $('sheet');
    const all = sh.querySelector('#bAll');
    if (all) sh.querySelector('#bApply').onclick = () => {
      const v = all.value.trim();
      items.forEach(it => { if (!it.skip) it.amt = v; });
      draw();
    };
    sh.querySelectorAll('.bamt').forEach(inp => inp.oninput = e => {
      items[+e.target.dataset.i].amt = e.target.value; refreshTotals();
    });
    sh.querySelectorAll('[data-skip]').forEach(btn => btn.onclick = () => {
      const it = items[+btn.dataset.skip];
      it.skip = !it.skip;
      // A device nobody could fix must not be swept into "repaired" with the
      // rest — that is the one thing a bulk action must never quietly do.
      draw();
    });
    const later = sh.querySelector('#bLater');
    if (later) later.onclick = () => commit(false);
    sh.querySelector('#bGo').onclick = () => commit(true);
  }

  function commit(collectNow){
    if (kind === 'estimate'){
      const bad = items.find(it => !it.skip && !(parseFloat(it.amt) > 0));
      if (bad) return toast('Give every device an estimate, or mark it as one that cannot be fixed.','#F59E0B','M12 2 1 21h22z');
    }
    let moved = 0, unfixed = 0;
    items.forEach(it => {
      const j = it.j, v = parseFloat(it.amt) || 0;
      if (kind === 'start'){ j.status = 'in_progress'; moved++; return; }
      if (kind === 'estimate'){
        if (it.skip){ j.status = 'unrepairable'; unfixed++; return; }
        j.approx = v;
        j.diagnosis = j.diagnosis || 'Repaired on the dealer batch run.';
        j.status = 'completed'; moved++; return;
      }
      if (kind === 'dispatch'){
        j.final = v;
        if (collectNow) j.cash += Math.max(v - paidOn(j), 0);
        j.status = 'delivered'; moved++; return;
      }
      if (kind === 'return'){
        j.final = v;                       // blank stays 0 — the fee is waived
        if (v > 0 && collectNow) j.cash += Math.max(v - paidOn(j), 0);
        j.status = 'returned'; moved++;
      }
    });
    closeSheet(); render();
    const msg = kind==='start'    ? `Batch started — ${moved} device${moved===1?'':'s'} on the bench.`
              : kind==='estimate' ? (moved ? `${moved} quoted${unfixed?`, ${unfixed} marked not repairable`:''}.`
                                          : `${unfixed} device${unfixed===1?'':'s'} marked not repairable.`)
              : kind==='dispatch' ? (collectNow ? `Batch closed — ${inr(items.reduce((s,it)=>s+(parseFloat(it.amt)||0),0))} collected.`
                                                : `Batch dispatched — the dealer owes ${inr(rollup(bid).totalDue)}.`)
              : `${moved} device${moved===1?'':'s'} returned.`;
    toast(msg);
  }

  draw();
}

      ${(!isBilled(j)&&j.status!=='cancelled')?`<div style="padding:8px 2px 4px;font-size:12px;line-height:1.45;color:var(--ink2)">

function dockHtml(j){
  const step = nextStep(j.status);
  if (!step){
    const r = ['unrepairable','returned'].includes(j.status) ? 'Send the inspection receipt' : 'Send the repair receipt';
    return `<span class="cap-lab">This job is closed</span>

  const tap = one && isOneTap(j.status, a0.to), guard = one && a0.to==='delivered';
  const capt = tap ? 'One tap · undo if wrong' : guard ? 'This closes the job' : step.q;
  let h = `<span class="cap-lab">${esc(capt)}</span>`;
  if (guard){
    h += `<div class="slide" id="slider" role="button" tabindex="0" aria-label="${esc(a0.label)}">
      <span class="lbl">${esc(a0.label)}</span><span class="arrows">››</span>
      <span class="knob">${svg(ICON.chev)}</span></div>`;
  } else if (step.choices.length===2){
    h += `<div class="pair">${step.choices.map(a=>`
      <button class="actbtn ${a.kind||''}" data-to="${a.to}" style="flex-direction:column;align-items:flex-start;gap:2px">
        <b style="font-size:15px">${esc(a.label)}</b>
        <span style="font-size:11.5px;font-weight:500;opacity:.85">${esc(a.detail||'')}</span></button>`).join('')}</div>`;
  } else {
    h += `<button class="actbtn" data-to="${a0.to}">${svg(ICON[a0.icon])}
      <span class="lb"><b>${esc(a0.label)}</b>${a0.detail?`<span>${esc(a0.detail)}</span>`:''}</span></button>`;
  }
  if (step.more.length){
    h += `<button class="morelink" id="moreLink">Something else happened</button>
      <div id="moreWrap" hidden style="display:grid;gap:8px;padding-top:8px">
        ${step.more.map(a=>`<button class="actbtn quiet" data-to="${a.to}">${svg(ICON[a.icon])}

  }
  return h;
}
function wireJob(id){
  const j = jobById(id);
  document.querySelectorAll('#dock [data-to]').forEach(b => b.onclick = () => beginMove(j, b.dataset.to));
  const ml = $('moreLink');
  if (ml) ml.onclick = () => { const w = $('moreWrap'); w.hidden = !w.hidden;
    ml.textContent = w.hidden ? 'Something else happened' : 'Less common, still allowed'; };
  const cr = document.querySelector('[data-act="closedReceipt"]');
  if (cr) cr.onclick = () => toast('The receipt preview opens here.','#005655',ICON.receipt);
  // A closed job has no step at all, so guard on the step and not just on the
  // element — the slider only exists for the one guarded move.
  const step = nextStep(j.status), sl = $('slider');
  if (sl && step) wireSlider(sl, j, step.choices[0]);
}
function wireSlider(track, job, action){
  const knob = track.querySelector('.knob');
  const max = () => track.clientWidth - 48 - 8;
  let dragging = false;
  const done = () => { knob.style.left = '4px'; beginMove(job, action.to); };
  knob.addEventListener('pointerdown', e => { dragging = true; knob.setPointerCapture(e.pointerId); });
  knob.addEventListener('pointermove', e => {
    if (!dragging) return;
    const x = e.clientX - track.getBoundingClientRect().left - 24;
    knob.style.left = Math.max(4, Math.min(4+max(), x)) + 'px';
    if (x >= max()){ dragging = false; done(); }
  });
  knob.addEventListener('pointerup', () => { if (dragging){ dragging = false; knob.style.left = '4px'; } });
  track.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' '){ e.preventDefault(); done(); } });
}
function beginMove(job, to){
  if (isOneTap(job.status, to)){
    const step = nextStep(job.status);
    const a = [...step.choices, ...step.more].find(x => x.to===to);
    job.status = to; render();
    toast(`${ST[to].label} · ${a?a.label:ST[to].label}`, '#0B1220', ICON.build);
    return;
  }
  moveSheet(job, to);
}
function moveSheet(job, to){
  const bill = needsBill(to), pay = needsPayment(to), verdict = to==='completed'||to==='unrepairable';
  let finalTxt = bill ? String(job.approx||'') : '', mode = 'cash', cash = '', gpay = '';
  const draw = () => {
    const c = collect(job, to, finalTxt);
    let b = '';
    if (verdict){
      b += `<label class="flab">Estimate given (₹)</label>
        <input class="finput" id="fEst" inputmode="decimal" value="${esc(String(job.approx||''))}">
        <span class="fhelp">What the customer agreed to at intake. Change it only if the real cost moved.</span>`;
      if (to==='completed') b += `<div style="height:14px"></div><label class="flab">Diagnosis / Fix Description *</label>
        <textarea class="finput" id="fDiag" rows="2" style="font-weight:500;font-size:13.5px"
          placeholder="Describe what was fixed...">${esc(job.diagnosis)}</textarea>`;
    }
    if (bill) b += `<label class="flab">${to==='returned'?'Inspection fee (₹)':'Final amount (₹)'}</label>
      <input class="finput" id="fFinal" inputmode="decimal" value="${esc(finalTxt)}">
      <span class="fhelp">${to==='returned'
        ?'Optional. Leave it empty to waive the fee — nothing will be owed.'
        :'Prefilled from the agreed estimate. Change it if the real cost differed.'}</span>`;
    if (pay){
      b += `<div class="collect"><div class="k">COLLECT NOW</div><div class="v">${inr(c.now)}</div>
        <div class="n">${esc(c.note)}</div></div>`;
      if (c.now>0){
        b += `<label class="flab" style="margin-top:14px">Payment mode</label><div class="modes" id="modes">
          <button class="mode" data-m="cash" aria-pressed="${mode==='cash'}">Cash</button>
          <button class="mode" data-m="gpay" aria-pressed="${mode==='gpay'}">GPay / UPI</button>
          <button class="mode" data-m="split" aria-pressed="${mode==='split'}">Split</button></div>`;
        if (mode==='split'){
          const cv = parseFloat(cash)||0, gv = parseFloat(gpay)||0, sum = cv+gv;
          const st = (!cash&&!gpay) ? 'info' : Math.abs(sum-c.now)<=0.01 ? 'good' : 'warn';
          const msg = st==='info' ? 'Type how much came in as cash — the rest fills in as GPay.'
                    : st==='good' ? `${inr(cv)} cash + ${inr(gv)} GPay = ${inr(c.now)}`
                    : `Cash and GPay must add up to ${inr(c.now)} — they currently total ${inr(sum)}.`;
          b += `<div class="two" style="margin-top:12px">
            <div><label class="flab">Cash (₹)</label><input class="finput" id="fCash" inputmode="numeric" value="${esc(cash)}"></div>
            <div><label class="flab">GPay (₹)</label><input class="finput" id="fGpay" inputmode="numeric" value="${esc(gpay)}"></div></div>
            <div class="notice ${st}" style="margin-top:12px">${svg(st==='good'?ICON.check:'M12 2 1 21h22z')}<div>${esc(msg)}</div></div>`;
        }
      }
    }
    if (!verdict && !bill && !pay) b += `<label class="flab">Remark ${to==='pending'?'*':'(optional)'}</label>
      <textarea class="finput" rows="2" style="font-weight:500;font-size:13.5px" placeholder="Anything worth recording"></textarea>`;

    openSheet(`<div class="grab"></div>
      <div class="sheet-h"><div class="g"><b>${esc(sheetTitle(to))}</b><span>Moves this device to ${ST[to].label}</span></div></div>
      <div class="sheet-b">${b}</div>
      <div class="sheet-f"><button class="btn" id="mvGo">${pay?'Take payment and close':'Move to '+ST[to].label}</button></div>`);

    const sh = $('sheet');
    const est = sh.querySelector('#fEst');  if (est) est.oninput = e => job.approx = parseFloat(e.target.value)||0;
    const dg  = sh.querySelector('#fDiag'); if (dg)  dg.oninput = e => job.diagnosis = e.target.value;
    const fn  = sh.querySelector('#fFinal');
    if (fn) fn.oninput = e => { finalTxt = e.target.value; const p = e.target.selectionStart; draw();
      const a = document.querySelector('#fFinal'); if (a){ a.focus(); a.setSelectionRange(p,p); } };
    const md = sh.querySelector('#modes');
    if (md) md.onclick = e => { const x = e.target.closest('.mode'); if (!x) return;
      mode = x.dataset.m; if (mode==='split'){ cash=''; gpay=''; } draw(); };
    /* the remainder mirrors into the other box on every keystroke, so an
       over-payment cannot be typed and an under-payment auto-completes */
    const fc = sh.querySelector('#fCash'), fg = sh.querySelector('#fGpay');
    if (fc) fc.oninput = e => { const v = Math.min(Math.max(parseFloat(e.target.value)||0,0), c.now);
      cash = e.target.value===''?'':String(v); gpay = e.target.value===''?'':String(Math.max(c.now-v,0)); draw(); };
    if (fg) fg.oninput = e => { const v = Math.min(Math.max(parseFloat(e.target.value)||0,0), c.now);
      gpay = e.target.value===''?'':String(v); cash = e.target.value===''?'':String(Math.max(c.now-v,0)); draw(); };

    sh.querySelector('#mvGo').onclick = () => {
      const cc = collect(job, to, finalTxt);
      if (to==='completed' && !String(job.diagnosis).trim())
        return toast('Describe what was fixed before marking this repaired.','#EF4444','M12 2 1 21h22z');
      if (pay && cc.now>0 && mode==='split'){
        const sum = (parseFloat(cash)||0)+(parseFloat(gpay)||0);
        if (Math.abs(sum-cc.now)>0.01) return toast(`Cash and GPay must add up to ${inr(cc.now)}.`,'#EF4444','M12 2 1 21h22z');
      }
      if (bill) job.final = parseFloat(finalTxt)||0;
      if (pay && cc.now>0){
        if (mode==='cash') job.cash += cc.now;
        else if (mode==='gpay') job.gpay += cc.now;
        else { job.cash += parseFloat(cash)||0; job.gpay += parseFloat(gpay)||0; }
      }
      job.status = to; closeSheet(); render(); toast('Status updated successfully!');
    };
  };
  draw();
}

/* ═══ 11 · SCREEN · Handover receipt ══════════════════════════════════════ */
function screenReceipt(id){
  const b = batchOf(id), all = jobsOf(id);
  const live = all.filter(j=>j.status!=='cancelled');
  const billed = live.filter(isBilled);
  // "Not yet billed" must mean STILL TO BE PRICED, so a closed device that was
  // never charged — an unrepairable phone returned with its fee waived — does
  // not count. The shipped buildBatchReceiptData() tests !isBilled alone, which
  // stamps a fully settled batch ESTIMATES ONLY the moment one fee is waived.
  // The trap the rule exists for is untouched: an OPEN unpriced device still
  // blocks PAID IN FULL.
  const unbilled = live.filter(j=>!isBilled(j) && !isClosed(j.status));
  const billedTotal = billed.reduce((s,j)=>s+j.final,0);
  const receivedTotal = live.reduce((s,j)=>s+paidOn(j),0);
  const unbilledEst = unbilled.reduce((s,j)=>s+(j.approx||0),0);
  const balance = rollup(id).totalDue;

  /* Order matters, and the middle branch is the trap: PAID IN FULL requires
     there is nothing LEFT to bill, not merely that something was billed. */
  const key = balance>0 ? 'due'
            : (billed.length && !unbilled.length) ? 'paid'
            : (!billed.length && live.length && live.every(j=>isClosed(j.status))) ? 'noCharge'
            : 'notBilled';
  const S = {
    due:      {t:'BALANCE DUE '+inr(balance), bg:'#FFF7ED', fg:'#C2410C', close:'Balance payable when the devices are collected.'},
    paid:     {t:'PAID IN FULL',   bg:'#ECFDF5', fg:'#047857', close:'All devices settled. Thank you.'},
    noCharge: {t:'NO CHARGE',      bg:'#E6EEEE', fg:'#005655', close:'Nothing charged on this drop-off.'},
    notBilled:{t:'ESTIMATES ONLY', bg:'#E6EEEE', fg:'#005655', close:'Amounts are estimates and may change once each device is inspected.'},
  }[key];
  const sub = (unbilled.length && live.length)
    ? `${unbilled.length} of ${live.length} device${live.length===1?'':'s'} not yet billed. This figure will change once they are priced.` : '';
  const asPdf = all.length > 5;

  return `${headerBand('Handover receipt','')}
    <div class="scroll"><div class="list" style="padding:16px 14px 20px">
      <p style="margin:0 0 12px;font-size:12px;line-height:1.45;color:var(--ink2)">${asPdf
        ? 'This is what the dealer receives, as a PDF. Check the devices and total, then send.'
        : 'This is what the dealer receives. Check the devices and total, then send.'}</p>
      <div class="rc">
        <div class="rc-h"><span class="no">#${esc(b.number)}</span>
          <div class="shop">${esc(SHOP.name)}</div>
          <div class="addr">${esc(SHOP.address)} · ${esc(SHOP.phone)}</div>
          <span class="chip2">DEVICE HANDOVER RECEIPT</span></div>
        <div class="rc-meta">
          <div><div class="k">RECEIVED FROM</div><div class="v">${esc(b.dealer.shop||b.dealer.name)}</div>
            <div class="v sm">${esc(b.dealer.phone)}</div></div>
          <div style="text-align:right"><div class="k">RECEIVED</div><div class="v">${longDate(b.createdAt)}</div>
            <div class="v sm">${b.expected?'Expected back '+longDate(b.expected):'—'}</div></div>
          <div><div class="k">TAKEN IN BY</div><div class="v sm" style="font-weight:700;color:var(--ink)">${esc(b.receivedBy)}</div></div>
          <div style="text-align:right"><div class="k">AS OF</div>
            <div class="v sm" style="font-weight:700;color:var(--ink)">${longDate(new Date())}</div></div>
        </div>
        <div class="rc-sec">DEVICES RECEIVED (${all.length})</div>
        ${all.length ? all.map((j,i)=>{
          const nm = `${j.brand} ${j.model}`.trim()||'Unknown device';
          const amt = j.status==='cancelled' ? '—' : isBilled(j) ? inr(j.final) : (j.approx?'est. '+inr(j.approx):'—');
          const strong = isBilled(j) && j.status!=='cancelled';
          return `<div class="rc-dev"><span class="n">${i+1}</span>
            <span class="b"><span class="t">${esc(nm)}</span>
              <span class="s">IMEI ${esc(groupImei(j.imei))} · ${ST[j.status].label}</span></span>
            <span class="a" style="color:${strong?'#0B1220':'#8A94A3'}">${esc(amt)}</span></div>`;
        }).join('') : `<div style="padding:6px 16px 8px;font-size:12px;color:var(--ink3)">No devices on this drop-off.</div>`}
        <div class="rc-tot">
          ${billedTotal>0?`<div class="r"><span class="k">Billed so far</span><span class="v">${inr(billedTotal)}</span></div>`:''}
          <div class="r mut"><span class="k">Received</span><span class="v">−${inr(receivedTotal)}</span></div>
          <div class="r mut"><span class="k">Not yet billed · ${unbilled.length} device${unbilled.length===1?'':'s'}</span>
            <span class="v">${unbilledEst?'est. '+inr(unbilledEst):'—'}</span></div>
          <hr><div class="r big"><span class="k">TO PAY NOW</span><span class="v">${inr(balance)}</span></div>
        </div>
        <div class="stamp" style="background:${S.bg};color:${S.fg};border:1px solid ${S.fg}47">${esc(S.t)}</div>
        ${sub?`<div class="stamp-sub">${esc(sub)}</div>`:''}
        <div class="rc-f">${esc(S.close)}</div>
      </div>
    </div></div>
    <div class="dock"><button class="btn" data-act="wa" style="background:#25D366">${svg(ICON.wa)}Send on WhatsApp</button></div>`;
}

/* ═══ 12 · Render ═════════════════════════════════════════════════════════ */
let lastKey = '';
function render(){
  const t = curr();
  const sc = $('screen');
  // A render replaces the whole screen, so hold the scroll position across one:
  // expanding "More" on device 12, or typing a search, must not throw the list
  // back to the top. Only within the same screen — a new screen starts at 0.
  const key = t.r + ':' + (t.id || '');
  const prev = sc.querySelector('.scroll');
  const keep = (key === lastKey && prev) ? prev.scrollTop : 0;

  if (t.r==='jobs')            sc.innerHTML = screenJobs();
  else if (t.r==='batchCreate')sc.innerHTML = screenIntake();
  else if (t.r==='batch')      sc.innerHTML = screenBatch(t.id);
  else if (t.r==='job')        sc.innerHTML = screenJob(t.id);
  else if (t.r==='receipt')    sc.innerHTML = screenReceipt(t.id);

  sc.querySelectorAll('[data-nav]').forEach(el => el.onclick = () => {
    const n = el.dataset.nav;
    if (n==='back') back();
    else if (n==='job')   go({r:'job',   id:+el.dataset.id});
    else if (n==='batch') go({r:'batch', id:+el.dataset.id});
  });
  if (t.r==='jobs')             wireJobs();
  else if (t.r==='batchCreate') wireIntake();
  else if (t.r==='batch')       wireBatch(t.id);
  else if (t.r==='job')         wireJob(t.id);
  else if (t.r==='receipt')     document.querySelector('[data-act="wa"]').onclick = () =>
    toast(jobsOf(t.id).length>5 ? 'Sending as a PDF — IMEIs stay readable.' : 'Sending as a picture on WhatsApp.','#25D366',ICON.wa);

  const now = sc.querySelector('.scroll');
  if (now && keep) now.scrollTop = keep;
  lastKey = key;
}

/* The phone fills the window; nothing else is on the page. */
function fit(){
  const s = Math.min((window.innerHeight - 30) / 844, (window.innerWidth - 30) / 390, 1.3);
  document.documentElement.style.setProperty('--scale', Math.max(.5, s).toFixed(3));
}
window.addEventListener('resize', fit); fit();

/* Invisible demo aids, so the screen stays clean: R resets, P plays the flow,
   Esc/Backspace is the hardware back button. */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key.toLowerCase();
  if (k === 'r'){ seed(); stack = [{r:'jobs'}]; filter = null; query = ''; resetForm(); closeSheet(); render(); }
  else if (k === 'p') play();
  else if (e.key === 'Escape' || e.key === 'Backspace'){
    e.preventDefault();
    if ($('scrim').classList.contains('on')) closeSheet(); else back();
  }
});

const wait = ms => new Promise(r => setTimeout(r, ms));
let playing = false;
async function play(){
  if (playing) return;
  playing = true;
  seed(); filter = null; query = ''; stack = [{r:'jobs'}]; render(); await wait(900);
  const b = DB.batches[0];
  stack = [{r:'jobs'},{r:'batch',id:b.id}]; render(); await wait(1100);
  const [j1, j2] = jobsOf(b.id);
  stack.push({r:'job', id:j1.id}); render(); await wait(900);
  j1.status='in_progress'; render(); toast('In Progress · Start working on it','#0B1220',ICON.build); await wait(1300);
  j1.diagnosis='Speaker mesh cleaned, earpiece flex replaced.'; j1.status='completed'; render();
  toast('Status updated successfully!'); await wait(1300);
  j1.final=j1.approx; j1.status='out_for_delivery'; render(); toast('Status updated successfully!'); await wait(1300);
  j1.cash=j1.final; j1.status='delivered'; render(); toast('Status updated successfully!'); await wait(1200);
  j2.status='in_progress'; render(); await wait(700);
  j2.status='unrepairable'; render(); toast('Not repairable — nothing was billed, so nothing is owed.','#0B1220',ICON.block); await wait(1400);
  stack = [{r:'jobs'},{r:'batch',id:b.id}]; render(); await wait(1200);
  stack.push({r:'receipt', id:b.id}); render();
  toast('Stamp recomputed — one device still unpriced.','#005655',ICON.receipt);
  playing = false;
}

render();
</script>
